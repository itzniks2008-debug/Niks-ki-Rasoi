<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dal Baati Special | Booking Admin</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f8ead0;
  color:#4b160f;
  padding:20px;
}

.header{
  background:#4b0f0b;
  color:white;
  padding:25px;
  border-radius:18px;
  margin-bottom:20px;
  text-align:center;
  border:2px solid #d9a441;
}

.header h1{
  color:#f4c65d;
  margin-bottom:8px;
}

.header p{
  color:#eadcc0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  border:1px solid #d9a441;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.stat h2{
  color:#741a12;
  font-size:30px;
}

.stat p{
  color:#777;
  margin-top:5px;
}

.booking{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:16px;
  border-left:6px solid #d9a441;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.booking.pending{
  border-left-color:#f0a500;
}

.booking.confirmed{
  border-left-color:#198754;
}

.booking.cancelled{
  border-left-color:#dc3545;
  opacity:.7;
}

.booking-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.booking-header h3{
  color:#65170f;
}

.status{
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.status.pending{
  background:#fff0c2;
  color:#9a6700;
}

.status.confirmed{
  background:#dff5e5;
  color:#176b2c;
}

.status.cancelled{
  background:#ffe1e1;
  color:#a30000;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:15px;
}

.detail{
  background:#fffaf0;
  padding:12px;
  border-radius:10px;
}

.detail strong{
  display:block;
  color:#741a12;
  margin-bottom:4px;
}

.special{
  background:#fff4d8;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

button,
.action-link{
  border:none;
  padding:11px 16px;
  border-radius:9px;
  cursor:pointer;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
}

.confirm{
  background:#198754;
  color:white;
}

.cancel{
  background:#dc3545;
  color:white;
}

.call{
  background:#0d6efd;
  color:white;
}

.whatsapp{
  background:#25d366;
  color:white;
}

.logout{
  margin-top:20px;
  background:#64170f;
  color:white;
  width:100%;
}

.empty{
  background:white;
  padding:40px;
  text-align:center;
  border-radius:15px;
  color:#777;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.admin-info{
  text-align:center;
  color:#777;
  margin-top:10px;
  font-size:13px;
}

@media(max-width:700px){

  body{
    padding:10px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .details{
    grid-template-columns:1fr;
  }

  .booking-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions button,
  .actions a{
    width:100%;
    text-align:center;
  }

}

</style>

</head>


<body>


<div class="header">

  <h1>🏜️ Dal Baati Special</h1>

  <p>📅 Table Booking Admin Panel</p>

  <div
    id="adminInfo"
    class="admin-info">

    Checking authentication...

  </div>

</div>


<div class="stats">

  <div class="stat">

    <h2 id="totalBookings">0</h2>

    <p>Total Bookings</p>

  </div>


  <div class="stat">

    <h2 id="pendingBookings">0</h2>

    <p>Pending</p>

  </div>


  <div class="stat">

    <h2 id="confirmedBookings">0</h2>

    <p>Confirmed</p>

  </div>

</div>


<div id="bookings">

  <div class="loading">

    🔐 Checking admin login...

  </div>

</div>


<audio
  id="bell"
  preload="auto">

  <source
    src="ding.mp3"
    type="audio/mpeg">

</audio>


<button
  id="logoutBtn"
  class="logout">

  🔓 Logout

</button>


<script type="module">


/* ================================
   FIREBASE IMPORTS
================================ */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  onSnapshot,
  updateDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyDz17AZWhfnOnO-DbC4CYWsoTAv4ojgyRE",

  authDomain:
    "niks-ordering-system.firebaseapp.com",

  projectId:
    "niks-ordering-system",

  storageBucket:
    "niks-ordering-system.firebasestorage.app",

  messagingSenderId:
    "486739954103",

  appId:
    "1:486739954103:web:5a9818c0c117b319f78032",

  measurementId:
    "G-92VL3H2VTL"

};


/* ================================
   INITIALIZE FIREBASE
================================ */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* ================================
   VARIABLES
================================ */

let firstLoad = true;

let previousBookingIds =
  new Set();

let unsubscribeBookings = null;


/* ================================
   AUTHENTICATION
================================ */

onAuthStateChanged(
  auth,
  (user) => {

    console.log(
      "Firebase auth state:",
      user
    );


    /* USER NOT LOGGED IN */

    if(!user){

      document.getElementById(
        "adminInfo"
      ).innerText =
        "Not authenticated";


      document.getElementById(
        "bookings"
      ).innerHTML = `

        <div class="empty">

          🔐 Login required.

          <br><br>

          Redirecting to login...

        </div>

      `;


      setTimeout(() => {

        window.location.replace(
          "admin-login.html"
        );

      },1000);


      return;

    }


    /* USER IS LOGGED IN */

    console.log(
      "Admin authenticated:",
      user.email
    );


    document.getElementById(
      "adminInfo"
    ).innerText =
      "Logged in as: " + user.email;


    /* START FIRESTORE ONLY
       AFTER AUTHENTICATION */

    startBookingListener();

  }
);


/* ================================
   BOOKING LISTENER
================================ */

function startBookingListener(){


  /* Prevent duplicate listener */

  if(unsubscribeBookings){

    unsubscribeBookings();

  }


  unsubscribeBookings =
    onSnapshot(

      collection(
        db,
        "bookings"
      ),


      (snapshot) => {


        const bookings = [];


        snapshot.forEach(
          (docSnap) => {

            bookings.push({

              id:docSnap.id,

              ...docSnap.data()

            });

          }
        );


        /* SORT NEWEST FIRST */

        bookings.sort(
          (a,b) => {

            const dateA =
              `${a.date || ""} ${a.time || ""}`;

            const dateB =
              `${b.date || ""} ${b.time || ""}`;

            return dateB.localeCompare(
              dateA
            );

          }
        );


        /* ==========================
           NEW BOOKING DETECTION
        ========================== */

        const currentIds =
          new Set(
            bookings.map(
              b => b.id
            )
          );


        if(!firstLoad){

          const newBooking =
            bookings.some(
              booking =>
                !previousBookingIds.has(
                  booking.id
                )
            );


          if(newBooking){

            const bell =
              document.getElementById(
                "bell"
              );


            bell.currentTime = 0;


            bell.play()
              .catch(
                () => {}
              );

          }

        }


        previousBookingIds =
          currentIds;


        firstLoad = false;


        renderBookings(
          bookings
        );


      },


      (error) => {

        console.error(
          "Firestore error:",
          error
        );


        document.getElementById(
          "bookings"
        ).innerHTML = `

          <div class="empty">

            ❌ Unable to load bookings.

            <br><br>

            ${escapeHTML(
              error.message
            )}

          </div>

        `;

      }

    );

}


/* ================================
   RENDER BOOKINGS
================================ */

function renderBookings(
  bookings
){


  const container =
    document.getElementById(
      "bookings"
    );


  /* ACTIVE BOOKINGS */

  const activeBookings =
    bookings.filter(
      b =>
        (
          b.status ||
          "pending"
        ).toLowerCase()
        !==
        "cancelled"
    );


  /* TOTAL */

  const total =
    activeBookings.length;


  /* PENDING */

  const pending =
    bookings.filter(
      b =>
        (
          b.status ||
          "pending"
        ).toLowerCase()
        ===
        "pending"
    ).length;


  /* CONFIRMED */

  const confirmed =
    bookings.filter(
      b =>
        (
          b.status ||
          ""
        ).toLowerCase()
        ===
        "confirmed"
    ).length;


  document.getElementById(
    "totalBookings"
  ).innerText =
    total;


  document.getElementById(
    "pendingBookings"
  ).innerText =
    pending;


  document.getElementById(
    "confirmedBookings"
  ).innerText =
    confirmed;


  /* NO BOOKINGS */

  if(activeBookings.length === 0){

    container.innerHTML = `

      <div class="empty">

        📅 No active table bookings.

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  /* CREATE EACH BOOKING */

  activeBookings.forEach(
    (booking) => {


      const status =
        (
          booking.status ||
          "pending"
        ).toLowerCase();


      const card =
        document.createElement(
          "div"
        );


      card.className =
        `booking ${status}`;


      const name =
        booking.name ||
        "Unknown";


      const phone =
        booking.phone ||
        "-";


      const people =
        booking.people ||
        "-";


      const date =
        booking.date ||
        "-";


      const time =
        booking.time ||
        "-";


      const specialRequest =
        booking.specialRequest ||
        "No special request";


      card.innerHTML = `

        <div class="booking-header">

          <h3>

            👤
            ${escapeHTML(name)}

          </h3>


          <span
            class="status ${status}">

            ${escapeHTML(
              status.toUpperCase()
            )}

          </span>

        </div>


        <div class="details">


          <div class="detail">

            <strong>
              📅 Date
            </strong>

            ${escapeHTML(date)}

          </div>


          <div class="detail">

            <strong>
              ⏰ Time
            </strong>

            ${escapeHTML(time)}

          </div>


          <div class="detail">

            <strong>
              👥 People
            </strong>

            ${escapeHTML(
              String(people)
            )}

          </div>


          <div class="detail">

            <strong>
              📱 Phone
            </strong>

            ${escapeHTML(phone)}

          </div>


        </div>


        <div class="special">

          <strong>
            📝 Special Request
          </strong>

          <br><br>

          ${escapeHTML(
            specialRequest
          )}

        </div>


        <div class="actions">


          ${
            status !== "confirmed"

            ? `

              <button
                class="confirm"
                onclick="changeStatus(
                  '${escapeHTML(booking.id)}',
                  'confirmed'
                )">

                ✅ Confirm

              </button>

            `

            : ""

          }


          <button
            class="cancel"
            onclick="changeStatus(
              '${escapeHTML(booking.id)}',
              'cancelled'
            )">

            ❌ Cancel

          </button>


          ${
            phone !== "-"

            ? `

              <a
                class="action-link call"
                href="tel:${encodeURIComponent(phone)}">

                📞 Call

              </a>


              <a
                class="action-link whatsapp"
                target="_blank"
                href="https://wa.me/91${encodeURIComponent(phone)}?text=${encodeURIComponent(
                  "Hello " +
                  name +
                  ", your table booking at Dal Baati Special has been received."
                )}">

                💬 WhatsApp

              </a>

            `

            : ""

          }


        </div>

      `;


      container.appendChild(
        card
      );


    }
  );

}


/* ================================
   CHANGE BOOKING STATUS
================================ */

window.changeStatus =
  async function(
    bookingId,
    newStatus
  ){

    try{


      await updateDoc(

        doc(
          db,
          "bookings",
          bookingId
        ),

        {
          status:
            newStatus
        }

      );


    }

    catch(error){

      console.error(
        error
      );


      alert(
        "❌ Could not update booking: " +
        error.message
      );

    }

  };


/* ================================
   HTML SAFETY
================================ */

function escapeHTML(
  value
){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ================================
   LOGOUT
================================ */

document.getElementById(
  "logoutBtn"
).addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

      window.location.replace(
        "admin-login.html"
      );

    }

    catch(error){

      console.error(
        error
      );

      alert(
        "Could not logout."
      );

    }

  }
);


/* ================================
   ENABLE AUDIO AFTER CLICK
================================ */

document.addEventListener(
  "click",
  () => {

    const bell =
      document.getElementById(
        "bell"
      );


    bell.play()
      .then(
        () => {

          bell.pause();

          bell.currentTime = 0;

        }
      )
      .catch(
        () => {}
      );

  },
  {
    once:true
  }
);


</script>

</body>

</html>
