<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dal Baati Special | Admin Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#7b281b,#3d0c08 55%,#210604);
}

.login-box{
  width:100%;
  max-width:430px;
  background:#fff8e8;
  padding:35px;
  border-radius:22px;
  border:3px solid #d9a441;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  font-size:50px;
  margin-bottom:8px;
}

h1{
  text-align:center;
  color:#64170f;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:28px;
}

label{
  display:block;
  color:#64170f;
  font-weight:bold;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:18px;
  border:1px solid #d5c5a4;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#b88620;
  box-shadow:0 0 0 2px rgba(184,134,32,.15);
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:75px;
}

.show-btn{
  position:absolute;
  right:8px;
  top:6px;
  padding:8px 10px;
  background:#eee0c0;
  color:#64170f;
  border:none;
  border-radius:7px;
  cursor:pointer;
}

.login-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:11px;
  background:#741a12;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:hover{
  background:#56100b;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  display:none;
  background:#ffe2e2;
  color:#a00000;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  text-align:center;
}

.footer{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-top:25px;
}

</style>

</head>


<body>


<div class="login-box">

  <div class="logo">🏜️</div>

  <h1>Dal Baati Special</h1>

  <p class="subtitle">
    Restaurant Owner Login
  </p>


  <div
    id="error"
    class="error">
  </div>


  <label for="email">
    📧 Email
  </label>

  <input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email">


  <label for="password">
    🔐 Password
  </label>

  <div class="password-box">

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password">

    <button
      type="button"
      class="show-btn"
      onclick="togglePassword()">

      Show

    </button>

  </div>


  <button
    id="loginBtn"
    class="login-btn"
    onclick="login()">

    🔐 Login to Dashboard

  </button>


  <div class="footer">
    Authorized restaurant staff only
  </div>

</div>



<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyDz17AZWhfnOnO-DbC4CYWsoTAv4ojgyRE",

  authDomain:
    "niks-ordering-system.firebaseapp.com",

  projectId:
    "niks-ordering-system",

  storageBucket:
    "niks-ordering-system.firebasestorage.app",

  messagingSenderId:
    "486739954103",

  appId:
    "1:486739954103:web:5a9818c0c117b319f78032",

  measurementId:
    "G-92VL3H2VTL"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


/* LOGIN */

window.login = async function(){

  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const errorBox =
    document.getElementById("error");

  const loginBtn =
    document.getElementById("loginBtn");


  errorBox.style.display = "none";


  if(email === "" || password === ""){

    errorBox.innerText =
      "Please enter email and password.";

    errorBox.style.display = "block";

    return;

  }


  loginBtn.disabled = true;

  loginBtn.innerText =
    "⏳ Logging in...";


  try{

    await setPersistence(
  auth,
  browserLocalPersistence
);

await signInWithEmailAndPassword(
  auth,
  email,
  password
);

/* LOGIN SUCCESS */

window.location.replace(
  "admin.html"
);

  }

  catch(error){

    console.error(error);

    errorBox.innerText =
      "❌ Invalid email or password.";

    errorBox.style.display =
      "block";

    loginBtn.disabled = false;

    loginBtn.innerText =
      "🔐 Login to Dashboard";

  }

};


/* SHOW / HIDE PASSWORD */

window.togglePassword = function(){

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-btn");


  if(password.type === "password"){

    password.type = "text";

    button.innerText = "Hide";

  }
  else{

    password.type = "password";

    button.innerText = "Show";

  }

};


/* ENTER KEY LOGIN */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      login();

    }

  }
);

</script>


</body>
</html>
